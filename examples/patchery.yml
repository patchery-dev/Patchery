# Save this in your own repository as .github/workflows/patchery.yml
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_AUTH_TOKEN  (required)
#   ANTHROPIC_BASE_URL    (optional - only if you use a compatible custom endpoint)
#   ANTHROPIC_MODEL       (optional)
name: Patchery

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Name of the package that broke (e.g. openai)"
        required: true
      target-dir:
        description: "Directory to fix, relative to the repository root"
        required: true
        default: "."
      test-command:
        description: "Verification command"
        required: true
        default: "npm test"
      changelog:
        description: "Changelog path or URL (empty = let the agent find it)"
        required: false
        default: ""

# These are necessary but NOT sufficient. You must also tick
# Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests"
# (and the same switch at the organisation level, if the repo belongs to one).
# Without it the fix is made and verified, then the PR step fails with
# "GitHub Actions is not permitted to create or approve pull requests".
permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Your dependencies must be installed so the agent can read the changelog
      # and so the tests can run. Replace with your own install command.
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.target-dir }}

      - name: Fix the broken dependency
        id: sma
        uses: patchery-dev/Patchery@v0
        with:
          package: ${{ inputs.package }}
          target-dir: ${{ inputs.target-dir }}
          test-command: ${{ inputs.test-command }}
          changelog: ${{ inputs.changelog }}
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ secrets.ANTHROPIC_BASE_URL }}
          anthropic-model: ${{ secrets.ANTHROPIC_MODEL }}

      # A run that could not finish leaves a diagnosis instead of a fix: what it tried,
      # why it stopped, what it had read. This turns a wasted run into a starting point.
      # Opt in by uncommenting - it creates an issue in your repository.
      # - name: File what it learned
      #   if: steps.sma.outputs.outcome == 'inconclusive' && steps.sma.outputs.diagnosis-file != ''
      #   uses: peter-evans/create-issue-from-file@v5
      #   with:
      #     title: "Patchery could not finish: ${{ inputs.package }}"
      #     content-filepath: ${{ steps.sma.outputs.diagnosis-file }}
      #     labels: patchery, needs-triage

      - name: Open a pull request
        if: steps.sma.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: patchery/${{ inputs.package }}
          title: "fix(deps): migrate ${{ inputs.package }} call sites"
          body-path: ${{ steps.sma.outputs.pr-body-file }}
          add-paths: ${{ steps.sma.outputs.files }}
          commit-message: "fix(deps): migrate ${{ inputs.package }} call sites"
          # The last label is the independent review's verdict: patchery:reviewed,
          # patchery:needs-attention, patchery:refuted or patchery:unreviewed. By
          # default a refuted fix still opens a PR - this is what makes that visible
          # in the pull request list instead of only inside the body. GitHub creates
          # the label on first use; give the three of them colours once and the list
          # sorts itself.
          labels: |
            dependencies
            automated
            ${{ steps.sma.outputs.review-label }}
          delete-branch: true
