# Runs Patchery against every confirmed case and prints one table.
#
# This is the artefact the project is judged on: a rate, over real breaks in
# repositories we do not own, with the losses in it. Not a demo.
#
# The cases come from benchmark/cases.json - the rows verify-batch confirmed as
# genuinely red-after-green. Running an unconfirmed case would put a sentence
# about the product in a container where the break may not exist, which has
# happened and produced three wrong conclusions in a row.
#
# It calls benchmark-run.yml rather than repeating it, so the setup, the census
# and the five outcomes stay defined in exactly one place.
name: Patchery (benchmark, all cases)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only cases whose repo or package contains this text (empty = all)"
        required: false
        default: ""
      limit:
        description: "Stop after this many cases (0 = no limit)"
        required: false
        default: "0"
      model:
        description: "Model for the fixer, e.g. glm-5.3-flash (empty = the repository default)"
        required: false
        default: ""
      max-turns:
        description: "Turn budget for the agent"
        required: false
        default: "45"
      briefing:
        description: "Show the agent the mechanical classification (on/off) - off measures whether it helps"
        required: false
        default: "on"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      # Every case is a paid agent run, so a silent truncation would be both a
      # smaller bill and a smaller denominator. The cap is 50 here for that
      # reason, and the script says out loud what it dropped.
      - name: Choose the cases to run
        id: build
        run: node scripts/batch-plan.mjs benchmark/cases.json --only "$ONLY" --limit "$LIMIT" --cap 50
        env:
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}

  run:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      # A case that fails is a result, not an accident that should cancel the rest.
      fail-fast: false
      # Each of these is a model doing twenty minutes of work. Four at a time is
      # kind to the provider's rate limit and keeps the bill legible.
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/benchmark-run.yml
    secrets: inherit
    with:
      repo: ${{ matrix.case.repo }}
      commit: ${{ matrix.case.commit }}
      package: ${{ matrix.case.package }}
      breaking-version: ${{ matrix.case['breaking-version'] }}
      test-command: ${{ matrix.case['test-command'] }}
      target-dir: ${{ matrix.case['target-dir'] }}
      node-version: ${{ matrix.case['node-version'] }}
      model: ${{ inputs.model }}
      max-turns: ${{ inputs.max-turns }}
      briefing: ${{ inputs.briefing }}

  report:
    needs: [plan, run]
    # A batch where half the cases failed is exactly when the table matters.
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect every result
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: results

      # The table is the artefact the whole benchmark exists to produce, so it
      # is the last place logic should sit untested. batch-report.mjs decides
      # what it says; this step only points it at the results.
      - name: The table
        run: node scripts/batch-report.mjs benchmark results benchmark.json --queued "$QUEUED"
        env:
          QUEUED: ${{ needs.plan.outputs.count }}

