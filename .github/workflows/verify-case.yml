# Checks whether a candidate benchmark case is real, without touching a laptop.
#
# A case is only useful to us if the story it tells is true: at this commit the
# tests passed, and installing that version of that package is what turned them
# red. Both halves have to be observed - a red CI badge on someone's PR proves
# neither, because lint, a missing CI secret and an already-broken pipeline all
# look the same from outside.
#
# This runs the candidate's own test suite in a throwaway container. Nothing is
# committed, nothing is pushed, no model is called.
#
# Callable two ways: by hand for one candidate, or by verify-batch.yml once per
# row of benchmark/candidates.json. The measurement lives here only, so a fix to
# it fixes every caller.
name: Patchery (verify a benchmark case)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Candidate repository, owner/name"
        required: true
      commit:
        description: "Commit to pin to"
        required: true
      package:
        description: "Package whose upgrade is meant to break the tests"
        required: true
      breaking-version:
        description: "Version to install, e.g. 8 or 8.0.1"
        required: true
      test-command:
        description: "How to run the tests"
        required: false
        default: "npm test"
      target-dir:
        description: "Directory to work in (for a monorepo, the sub-package)"
        required: false
        default: "."
      node-version:
        description: "Node version (auto = ask the repository)"
        required: false
        default: "auto"
  workflow_call:
    inputs:
      repo: { type: string, required: true }
      commit: { type: string, required: true }
      package: { type: string, required: true }
      breaking-version: { type: string, required: true }
      test-command: { type: string, required: false, default: "npm test" }
      target-dir: { type: string, required: false, default: "." }
      node-version: { type: string, required: false, default: "auto" }

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # One name per case, so a batch of fifty can upload fifty results without
      # colliding and the report can be read without opening a single log.
      - name: Name this case
        id: slug
        run: |
          SLUG=$(printf '%s' '${{ inputs.repo }}-${{ inputs.package }}-v${{ inputs.breaking-version }}' | tr -c 'A-Za-z0-9._-' '-')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      # Two of the values are typed by hand and both are long. A wrong one costs a
      # minute of git retries and then an "UNKNOWN - install failed" verdict that
      # names the wrong thing; the repository name in run 3 was short one letter and
      # the run said the tests never ran, which was true and useless. Ask first, so a
      # typo comes back as a typo.
      - name: Check the repository and commit exist
        run: |
          set -o pipefail
          BASE=https://api.github.com/repos/${{ inputs.repo }}
          if ! curl -sfL -H "Accept: application/vnd.github+json" "$BASE" > /dev/null; then
            echo "::error::No repository called ${{ inputs.repo }}. Check the spelling - it is owner/name."
            exit 1
          fi
          if ! curl -sfL -H "Accept: application/vnd.github+json" "$BASE/commits/${{ inputs.commit }}" > /dev/null; then
            echo "::error::${{ inputs.repo }} exists but has no commit ${{ inputs.commit }}."
            exit 1
          fi

      # Our own repository, for the small scripts this workflow leans on. Same
      # layout as benchmark-run: ours under `patchery`, theirs under `case`, and
      # neither able to be mistaken for the other.
      # The runner's own Node, captured before setup-node replaces it.
      #
      # Everything below sets up the CANDIDATE's Node so its tests run the way
      # its maintainers run them - and that Node can be ancient. node-fetch's CI
      # uses 12, where `??` is a syntax error, so our own result-writing script
      # failed to parse and three cases finished with no result at all.
      #
      # Our tooling is not the thing being measured and must not inherit the
      # subject's runtime. It runs on this one.
      - name: Remember the runner's own Node
        id: ours
        run: |
          echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
          echo "our tooling runs on $(node --version) at $(command -v node)"
      - name: Check out Patchery
        uses: actions/checkout@v4
        with:
          path: patchery

      - name: Check out the candidate at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.commit }}
          path: case
          # The pinned commit is all we need; a full history on a large repo is
          # minutes of download for nothing.
          fetch-depth: 1

      # A candidate says which Node it needs, and it is not a detail. Pinning our
      # own guess made `mozilla/treeherder` look already-broken: its suite calls
      # Set.prototype.intersection, which exists from Node 22, and we gave it 20.
      # That verdict was about our runner, not the repository - the worst kind of
      # wrong answer, because it reads as a finding and quietly drops a good case.
      # Two candidates, not one, because no static rule picks the right Node.
      #
      # Too low and the project's own tooling will not start: knex declares
      # `engines: ">=16"`, and on 16 a devDependency refused to load, so the batch
      # recorded "already failing at this commit" about a healthy repository.
      # Too high and the break disappears: express's ESM failure exists on 18 and
      # not on 22.
      #
      # And a repository's CI names versions that are not interchangeable - axios
      # runs compatibility smoke jobs on Node 12 beside a real suite on 26. So the
      # first candidate is the lowest version CI runs, where a break matters most,
      # and the fallback is the highest, where the tooling is most likely to work.
      # Whichever produces a suite that actually runs is the one used.
      - name: Decide which Node to use
        id: node
        run: |
          LIST=$("${{ steps.ours.outputs.node }}" "$GITHUB_WORKSPACE/patchery/scripts/node-version.mjs" '${{ inputs.node-version }}' case/${{ inputs.target-dir }} --list)
          echo "candidates: $LIST"
          echo "first=$(echo "$LIST" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "last=$(echo "$LIST" | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Use Node ${{ steps.node.outputs.first }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.first }}

      - name: Report what is being verified
        run: |
          {
            echo "## ${{ inputs.repo }} - ${{ inputs.package }} v${{ inputs.breaking-version }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| pinned to | \`${{ inputs.commit }}\` |"
            echo "| test command | \`${{ inputs.test-command }}\` |"
            echo "| directory | \`${{ inputs.target-dir }}\` |"
            echo "| node | \`${{ steps.node.outputs.first }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Lockfile decides the tool. `npm ci` is refused when the lockfile and
      # package.json disagree, which is common on an old commit, so a plain
      # install is the fallback rather than a failure.
      #
      # continue-on-error throughout: in a batch, one candidate that will not
      # install must not take the other forty-nine down with it. The verdict step
      # reads the outcomes and says what actually happened.
      - name: Install dependencies
        id: install
        working-directory: case/${{ inputs.target-dir }}
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile 2>&1 | tail -40 || pnpm install --no-frozen-lockfile 2>&1 | tail -40
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile 2>&1 | tail -40 || yarn install 2>&1 | tail -40
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            npm ci 2>&1 | tail -40 || npm install 2>&1 | tail -40
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      # Half one of the story: the tests are green here. If they are not, the
      # case is dead on arrival - a suite that is already red cannot be used to
      # show that an upgrade broke it, and cannot be used to show a fix worked.
      - name: Run the tests BEFORE the upgrade
        id: before
        if: steps.install.outcome == 'success'
        working-directory: case/${{ inputs.target-dir }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set +e
          ${{ inputs.test-command }} > /tmp/before.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -40 /tmp/before.log

      # Second attempt, on the highest Node this repository's CI runs. Only when
      # the first one produced a red suite - and a red suite here is far more
      # often our runtime than the repository, which is what sixteen of
      # thirty-three verdicts turned out to be.
      - name: Use Node ${{ steps.node.outputs.last }} instead
        if: steps.before.outputs.exit != '0' && steps.node.outputs.last != steps.node.outputs.first
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.last }}

      - name: Install and test again on Node ${{ steps.node.outputs.last }}
        id: retry
        if: steps.before.outputs.exit != '0' && steps.node.outputs.last != steps.node.outputs.first
        working-directory: case/${{ inputs.target-dir }}
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set +e
          # A fresh install: native modules built against the previous Node will
          # not load on this one, and their failure would read as the repository
          # being broken.
          rm -rf node_modules
          if [ '${{ steps.install.outputs.pm }}' = 'pnpm' ]; then pnpm install --no-frozen-lockfile > /tmp/reinstall.log 2>&1
          elif [ '${{ steps.install.outputs.pm }}' = 'yarn' ]; then yarn install > /tmp/reinstall.log 2>&1
          else npm ci > /tmp/reinstall.log 2>&1 || npm install > /tmp/reinstall.log 2>&1; fi
          tail -10 /tmp/reinstall.log
          ${{ inputs.test-command }} > /tmp/before.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          echo "node: $(node --version)"
          tail -40 /tmp/before.log

      # Whichever attempt produced a green suite is the one the case is measured
      # against; the rest of the workflow reads this and not the individual steps.
      - name: Settle on a baseline
        id: baseline
        run: |
          FIRST='${{ steps.before.outputs.exit }}'
          RETRY='${{ steps.retry.outputs.exit }}'
          if [ "$FIRST" = "0" ]; then
            echo "exit=0" >> "$GITHUB_OUTPUT"
            echo "node=${{ steps.node.outputs.first }}" >> "$GITHUB_OUTPUT"
          elif [ "$RETRY" = "0" ]; then
            echo "exit=0" >> "$GITHUB_OUTPUT"
            echo "node=${{ steps.node.outputs.last }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Node ${{ steps.node.outputs.first }} could not run this suite; measured on ${{ steps.node.outputs.last }} instead"
          else
            echo "exit=${FIRST:-1}" >> "$GITHUB_OUTPUT"
            echo "node=${{ steps.node.outputs.first }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the breaking version
        id: bump
        if: steps.baseline.outputs.exit == '0'
        working-directory: case/${{ inputs.target-dir }}
        continue-on-error: true
        run: |
          set -o pipefail
          PM='${{ steps.install.outputs.pm }}'
          SPEC='${{ inputs.package }}@${{ inputs.breaking-version }}'
          if [ "$PM" = "pnpm" ]; then
            pnpm add "$SPEC" 2>&1 | tail -20
          elif [ "$PM" = "yarn" ]; then
            yarn add "$SPEC" 2>&1 | tail -20
          else
            npm install "$SPEC" 2>&1 | tail -20
          fi
          # Read from disk, not through resolution: an ESM-only major publishes an
          # `exports` map that hides its own package.json, and the resolving probe
          # then reports the upgrade as never installed - a false negative aimed
          # squarely at the packages this benchmark is made of.
          echo "installed: ${{ inputs.package }}@$("${{ steps.ours.outputs.node }}" "$GITHUB_WORKSPACE/patchery/scripts/installed-version.mjs" '${{ inputs.package }}' .)"

      # Half two: the same suite, same machine, one thing changed.
      - name: Run the tests AFTER the upgrade
        id: after
        if: steps.bump.outcome == 'success'
        working-directory: case/${{ inputs.target-dir }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set +e
          ${{ inputs.test-command }} > /tmp/after.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -60 /tmp/after.log

      # One sentence, so a candidate can be accepted or dropped without opening a
      # log, and one JSON file, so fifty of them can be read as a table.
      - name: Verdict
        if: always()
        run: |
          BEFORE='${{ steps.baseline.outputs.exit }}'
          AFTER='${{ steps.after.outputs.exit }}'
          if [ '${{ steps.install.outcome }}' != 'success' ]; then
            V=UNKNOWN
            D="dependencies would not install - not evidence against the case"
          elif [ -z "$BEFORE" ]; then
            V=UNKNOWN
            D="the tests never finished; the red step above says why"
          elif [ "$BEFORE" != "0" ]; then
            V=NOT-A-CASE
            D="already failing at this commit (exit $BEFORE) - read the log, a Node too old for the suite looks the same"
          elif [ '${{ steps.bump.outcome }}' != 'success' ]; then
            V=UNKNOWN
            D="green before, but ${{ inputs.package }}@${{ inputs.breaking-version }} would not install"
          elif [ -z "$AFTER" ]; then
            V=UNKNOWN
            D="green before, but the second run did not finish"
          elif [ "$AFTER" = "0" ]; then
            V=NOT-A-CASE
            D="still green with ${{ inputs.package }}@${{ inputs.breaking-version }} - the suite does not cover the changed calls"
          else
            V=VALID
            D="green before, red after (exit $AFTER) - the break is real and this suite sees it"
          fi
          {
            echo ""
            echo "### $V"
            echo ""
            echo "$D"
            echo ""
            echo "Measured on Node ${{ steps.baseline.outputs.node }}."
          } >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const [repo, pkg, version, commit, verdict, detail] = process.argv.slice(1);
            require('fs').writeFileSync('/tmp/result.json', JSON.stringify({
              repo, package: pkg, version, commit, verdict, detail,
              run: process.env.GITHUB_RUN_ID,
            }));
          " '${{ inputs.repo }}' '${{ inputs.package }}' '${{ inputs.breaking-version }}' '${{ inputs.commit }}' "$V" "$D"

      # The full logs, so a verdict can be argued with rather than trusted.
      - name: Keep the result and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-${{ steps.slug.outputs.slug }}
          path: |
            /tmp/result.json
            /tmp/*.log
          if-no-files-found: ignore
