# Measures what `verify-min-confidence` actually buys, by running the real reviewer
# over calibration/ - 23 changes to the fixture whose correctness is already known.
#
# Runs here rather than on anyone's laptop for two reasons: the provider key stays
# in Secrets where it already lives, and the run that produced a number we publish
# becomes an artifact anyone can open. A measurement nobody can re-check is just an
# assertion with a decimal point in it.
#
# It costs one review per case. Triggered by hand, never automatically.
name: Patchery (calibrate)

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Give the reviewer Read/Grep/Glob (matches verify-tools: on)"
        type: boolean
        required: false
        default: false
      max-turns:
        description: "Turn limit per review"
        required: false
        default: "12"
      only:
        description: "Substring filter, e.g. 'good-01' - for debugging the harness cheaply"
        required: false
        default: ""
      model:
        description: "Reviewer model; empty uses the selected provider's model secret"
        required: false
        default: ""
      provider:
        description: "Which endpoint to review through"
        type: choice
        required: false
        default: default
        options:
          - default
          - alt

# Reads the repository and nothing else. This workflow opens no PR, writes no
# branch, and touches no issue - it produces a number and an artifact.
permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The harness only imports the SDK when a model will actually be called.
      - name: Install the agent SDK
        run: npm install --no-audit --no-fund

      - name: Run the calibration
        id: run
        env:
          # Both providers arrive as plain env and the shell below picks one. The
          # nested-expression alternative was unreadable, and this is the step that
          # decides which company sees the diff - it should be legible.
          #
          # `alt` is a second endpoint for the independence question: two models from
          # the same family share blind spots, so the strongest reviewer is one from
          # a different provider entirely. Add ALT_BASE_URL / ALT_AUTH_TOKEN /
          # ALT_MODEL as secrets to use it. Credentials are secrets, never inputs -
          # a workflow_dispatch input is displayed unmasked in the run's own UI.
          DEFAULT_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          DEFAULT_AUTH: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          DEFAULT_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # Read from both stores. A model name is not a credential, and putting it
          # in Secrets actively hurt: GitHub masks secret values everywhere, so the
          # "Measured on: <model>" line - the one check that proves which model
          # actually answered - printed as "***". Put ALT_MODEL in Variables. The
          # secrets fallback stays so an existing setup keeps working.
          ALT_BASE_URL: ${{ vars.ALT_BASE_URL || secrets.ALT_BASE_URL }}
          ALT_AUTH: ${{ secrets.ALT_AUTH_TOKEN }}
          ALT_MODEL: ${{ vars.ALT_MODEL || secrets.ALT_MODEL }}
          PROVIDER: ${{ inputs.provider }}
          # Through the environment, never interpolated into the script. A `${{ }}`
          # holding a dispatch input is pasted in as shell source before bash sees
          # it, so `--only "; curl evil"` would simply run. Only someone who can
          # already push here can dispatch this, but a repository whose whole
          # subject is "do not trust what came back" should not write that line.
          MODEL_OVERRIDE: ${{ inputs.model }}
          TOOLS: ${{ inputs.tools }}
          MAX_TURNS: ${{ inputs.max-turns }}
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          if [ "$PROVIDER" = "alt" ]; then
            # Fail here rather than running into an authentication error thirty
            # seconds and one confusing stack trace later. Named one by one: the
            # first version of this said only "ALT_AUTH_TOKEN is not set" and sent
            # it to stderr, which `tee` does not capture, so the job summary was
            # blank and the message reached nobody.
            missing=""
            [ -n "$ALT_AUTH" ] || missing="$missing ALT_AUTH_TOKEN(secret)"
            [ -n "$ALT_BASE_URL" ] || missing="$missing ALT_BASE_URL(variable-or-secret)"
            [ -n "$ALT_MODEL$MODEL_OVERRIDE" ] || missing="$missing ALT_MODEL(variable)"
            if [ -n "$missing" ]; then
              echo "provider: alt selected, but missing:$missing"
              echo "Settings -> Secrets and variables -> Actions. The token belongs under"
              echo "Secrets; the base URL and model belong under Variables, because GitHub"
              echo "masks every secret value and a masked model name defeats the check that"
              echo "proves which model answered."
              exit 1
            fi
            export ANTHROPIC_BASE_URL="$ALT_BASE_URL"
            export ANTHROPIC_AUTH_TOKEN="$ALT_AUTH"
            MODEL="${MODEL_OVERRIDE:-$ALT_MODEL}"
          else
            export ANTHROPIC_BASE_URL="$DEFAULT_BASE_URL"
            export ANTHROPIC_AUTH_TOKEN="$DEFAULT_AUTH"
            MODEL="${MODEL_OVERRIDE:-$DEFAULT_MODEL}"
          fi
          # All four, exactly as action.yml does it. ANTHROPIC_MODEL on its own gets
          # silently remapped to one of the DEFAULT_* tiers, and then the results
          # file would name a model that never ran - the one failure this whole
          # workflow exists to avoid.
          export ANTHROPIC_MODEL="$MODEL"
          export ANTHROPIC_DEFAULT_OPUS_MODEL="$MODEL"
          export ANTHROPIC_DEFAULT_SONNET_MODEL="$MODEL"
          export ANTHROPIC_DEFAULT_HAIKU_MODEL="$MODEL"
          echo "provider=$PROVIDER model=$MODEL"
          args=(--max-turns "$MAX_TURNS" --out calibration/results.json)
          # `if`, not `[ ... ] && ...`: the runner's shell is `bash -e`, where a
          # failing test as the last command of an AND-list ends the whole step.
          if [ "$TOOLS" = "true" ]; then args+=(--tools); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          # 2>&1: a failure writes to stderr, `tee` only captures stdout, and the
          # summary step then renders a blank report over a red job. Run #4 failed
          # exactly that way and said nothing about why.
          node scripts/calibrate.mjs "${args[@]}" 2>&1 | tee calibration/run.log

      # The numbers, readable without downloading anything. GitHub masks registered
      # secrets in this summary the same way it does in the log.
      - name: Put the report in the summary
        if: always()
        run: |
          {
            echo "### Patchery — confidence calibration"
            echo
            echo '```'
            cat calibration/run.log || echo "(the run produced no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # results.json records the endpoint as a hostname and redacts the token: an
      # artifact is not covered by GitHub's secret masking.
      - name: Upload the raw samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-results
          path: |
            calibration/results.json
            calibration/run.log
          if-no-files-found: warn
          retention-days: 90
