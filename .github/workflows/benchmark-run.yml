# Runs Patchery against a confirmed case, in a repository we do not own.
#
# verify-case.yml answers "is this break real". This answers the question the
# whole project is judged on: given a real break in somebody else's code, does
# Patchery fix it, refuse it, or get it wrong.
#
# The setup is deliberately the same as verify-case's, up to the point where the
# tests are red. From there this hands the broken checkout to the action and
# records what came back. Nothing is pushed and no pull request is opened - the
# candidate repositories are not ours to write to.
name: Patchery (benchmark run)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository, owner/name (must be a confirmed case)"
        required: true
      commit:
        description: "Commit to pin to"
        required: true
      package:
        description: "Package to upgrade and then fix the call sites of"
        required: true
      breaking-version:
        description: "Version to install"
        required: true
      test-command:
        description: "How to run the tests"
        required: false
        default: "npm test"
      target-dir:
        description: "Directory inside the candidate to fix"
        required: false
        default: "."
      node-version:
        description: "Node version (auto = ask the repository)"
        required: false
        default: "auto"
      model:
        description: "Model for the fixer (empty = the repository default)"
        required: false
        default: ""
      max-turns:
        description: "Turn budget for the agent"
        required: false
        default: "45"
      briefing:
        description: "Show the agent the mechanical classification (on/off)"
        required: false
        default: "on"
  workflow_call:
    inputs:
      repo: { type: string, required: true }
      commit: { type: string, required: true }
      package: { type: string, required: true }
      breaking-version: { type: string, required: true }
      test-command: { type: string, required: false, default: "npm test" }
      target-dir: { type: string, required: false, default: "." }
      node-version: { type: string, required: false, default: "auto" }
      model: { type: string, required: false, default: "" }
      max-turns: { type: string, required: false, default: "45" }
      briefing: { type: string, required: false, default: "on" }
    secrets:
      ANTHROPIC_AUTH_TOKEN: { required: true }
      ANTHROPIC_BASE_URL: { required: false }
      ALT_AUTH_TOKEN: { required: false }

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Name this case
        id: slug
        run: |
          SLUG=$(printf '%s' "$IN_REPO-$IN_PACKAGE-v$IN_VERSION" | tr -c 'A-Za-z0-9._-' '-')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_PACKAGE: ${{ inputs.package }}
          IN_VERSION: ${{ inputs.breaking-version }}

      # The runner's own Node, captured before setup-node replaces it.
      #
      # Everything below sets up the CANDIDATE's Node so its tests run the way
      # its maintainers run them - and that Node can be ancient. node-fetch's CI
      # uses 12, where `??` is a syntax error, so our own result-writing script
      # failed to parse and three cases finished with no result at all.
      #
      # Our tooling is not the thing being measured and must not inherit the
      # subject's runtime. It runs on this one.
      - name: Remember the runner's own Node
        id: ours
        run: |
          echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
          echo "our tooling runs on $(node --version) at $(command -v node)"

      # Patchery itself. Checked out into a directory of its own so the action's
      # own files can never be mistaken for the candidate's.
      - name: Check out Patchery
        uses: actions/checkout@v7
        with:
          path: patchery

      - name: Check out the candidate at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.commit }}
          path: case
          fetch-depth: 1

      # Same reasoning as verify-case: the repository says which Node it needs,
      # and guessing produced a verdict about our runner rather than the code.
      # Same two candidates as verify-case, for the same reason: `engines.node` is
      # the library's runtime floor, not the Node its tests run on, and the gap
      # cost sixteen verdicts in the first batch. First the lowest version CI
      # runs, where a break matters most; if that suite will not start, the
      # highest, where the tooling is most likely to work.
      - name: Decide which Node to use
        id: node
        run: |
          LIST=$("$OURS_NODE" "$GITHUB_WORKSPACE/patchery/scripts/node-version.mjs" "$IN_NODE_VERSION" "case/$IN_TARGET_DIR" --list)
          echo "candidates: $LIST"
          echo "first=$(echo "$LIST" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "last=$(echo "$LIST" | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
        env:
          OURS_NODE: ${{ steps.ours.outputs.node }}
          IN_NODE_VERSION: ${{ inputs.node-version }}
          IN_TARGET_DIR: ${{ inputs.target-dir }}

      - name: Use Node ${{ steps.node.outputs.first }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.first }}

      - name: Install the candidate's dependencies
        id: install
        working-directory: case/${{ inputs.target-dir }}
        run: |
          set -o pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile 2>&1 | tail -20 || pnpm install --no-frozen-lockfile 2>&1 | tail -20
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile 2>&1 | tail -20 || yarn install 2>&1 | tail -20
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            npm ci 2>&1 | tail -20 || npm install 2>&1 | tail -20
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      # The census. Which tests exist and pass while the code is still whole is
      # the only honest baseline for judging the fix: a suite that ends with
      # fewer tests than it started with has not been fixed, it has been edited
      # into agreement. Recorded before anything is broken, so no later step -
      # ours or the agent's - can influence it.
      - name: Count the tests before anything is touched
        id: census
        working-directory: case/${{ inputs.target-dir }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set +e
          # Unquoted on purpose - this IS a command line and the shell has to
          # split it into words. What it must not be is pasted into the script
          # before the shell ever sees it; that is the injection, not this.
          $TEST_COMMAND > /tmp/baseline.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          "$OURS_NODE" "$GITHUB_WORKSPACE/patchery/scripts/test-census.mjs" /tmp/baseline.log > /tmp/census-before.json
          cat /tmp/census-before.json
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          OURS_NODE: ${{ steps.ours.outputs.node }}

      - name: Use Node ${{ steps.node.outputs.last }} instead
        if: steps.census.outputs.exit != '0' && steps.node.outputs.last != steps.node.outputs.first
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.last }}

      # node_modules is rebuilt: native modules compiled against the previous
      # Node will not load on this one, and their failure would read as the
      # repository being broken.
      - name: Install and count again on Node ${{ steps.node.outputs.last }}
        id: recensus
        if: steps.census.outputs.exit != '0' && steps.node.outputs.last != steps.node.outputs.first
        working-directory: case/${{ inputs.target-dir }}
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set +e
          rm -rf node_modules
          if [ "$PM" = 'pnpm' ]; then pnpm install --no-frozen-lockfile > /tmp/reinstall.log 2>&1
          elif [ "$PM" = 'yarn' ]; then yarn install > /tmp/reinstall.log 2>&1
          else npm ci > /tmp/reinstall.log 2>&1 || npm install > /tmp/reinstall.log 2>&1; fi
          tail -10 /tmp/reinstall.log
          $TEST_COMMAND > /tmp/baseline.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          "$OURS_NODE" "$GITHUB_WORKSPACE/patchery/scripts/test-census.mjs" /tmp/baseline.log > /tmp/census-before.json
          cat /tmp/census-before.json
        env:
          PM: ${{ steps.install.outputs.pm }}
          TEST_COMMAND: ${{ inputs.test-command }}
          OURS_NODE: ${{ steps.ours.outputs.node }}

      # Whichever attempt produced a green suite is what everything downstream
      # reads - including the Node handed to the action, so the agent is never
      # judged on a runtime the case was not measured on.
      - name: Settle on a baseline
        id: baseline
        run: |
          if [ "$FIRST" = "0" ]; then
            echo "exit=0" >> "$GITHUB_OUTPUT"
            echo "node=$NODE_FIRST" >> "$GITHUB_OUTPUT"
          elif [ "$RETRY" = "0" ]; then
            echo "exit=0" >> "$GITHUB_OUTPUT"
            echo "node=$NODE_LAST" >> "$GITHUB_OUTPUT"
            echo "::notice::Node $NODE_FIRST could not run this suite; measured on $NODE_LAST instead"
          else
            echo "exit=${FIRST:-1}" >> "$GITHUB_OUTPUT"
            echo "node=$NODE_FIRST" >> "$GITHUB_OUTPUT"
          fi
        env:
          FIRST: ${{ steps.census.outputs.exit }}
          RETRY: ${{ steps.recensus.outputs.exit }}
          NODE_FIRST: ${{ steps.node.outputs.first }}
          NODE_LAST: ${{ steps.node.outputs.last }}

      - name: Install the breaking version
        id: bump
        if: steps.baseline.outputs.exit == '0'
        working-directory: case/${{ inputs.target-dir }}
        run: |
          set -o pipefail
          SPEC="$IN_PACKAGE@$IN_VERSION"
          # Not piped through `tail`. This is the evidence for whether the break
          # exists at all, and the first two runs of this workflow could not be
          # explained because npm's own summary of what it changed had been
          # trimmed off the end of the log.
          if [ "$PM" = "pnpm" ]; then pnpm add "$SPEC"
          elif [ "$PM" = "yarn" ]; then yarn add "$SPEC"
          else npm install "$SPEC"; fi
          INSTALLED=$("$OURS_NODE" "$GITHUB_WORKSPACE/patchery/scripts/installed-version.mjs" "$IN_PACKAGE" .)
          echo "installed: $IN_PACKAGE@$INSTALLED"
          echo "installed=$INSTALLED" >> "$GITHUB_OUTPUT"
          case "$INSTALLED" in
            "$IN_VERSION"*) ;;
            *) echo "::warning::asked for $IN_VERSION, got $INSTALLED - the break may not be present" ;;
          esac
        env:
          PM: ${{ steps.install.outputs.pm }}
          IN_PACKAGE: ${{ inputs.package }}
          IN_VERSION: ${{ inputs.breaking-version }}
          OURS_NODE: ${{ steps.ours.outputs.node }}

      # Confirm the repository is actually red, here, before handing it over.
      #
      # This step is what found the bug it was written to guard against. Three
      # runs reported "nothing to fix" while verify-case reproduced the same case
      # red twice, and both logs looked complete. The difference was one line the
      # logs did print and nobody compared: npm 10.8.2 in our steps, npm 10.9.8
      # inside the action - two different Nodes. The action set up Node 22 by
      # default over the Node 18 the benchmark had chosen from express's own
      # engines, and on 22 `require()` of an ES module works. The break was real
      # and evaporated the moment the agent's step began.
      #
      # The action no longer overrides the project's Node, and this workflow now
      # hands it the same version it measured on. The precondition stays anyway:
      # a benchmark that grades the agent on an unbroken repository is measuring
      # nothing, and that must be impossible rather than merely unlikely.
      - name: Confirm the break is present
        id: broken
        working-directory: case/${{ inputs.target-dir }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set +e
          echo "resolved : $(node -p "require.resolve(process.env.IN_PACKAGE)" 2>&1 | head -1)"
          echo "on disk  : $("$OURS_NODE" "$GITHUB_WORKSPACE/patchery/scripts/installed-version.mjs" "$IN_PACKAGE" .)"
          echo "node     : $(node --version)"
          $TEST_COMMAND > /tmp/broken.log 2>&1
          EXIT=$?
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          echo "test exit: $EXIT"
          tail -25 /tmp/broken.log
          if [ "$EXIT" = "0" ]; then
            echo "::warning::the suite is green after installing $IN_PACKAGE@$IN_VERSION - there is no break here to fix"
          fi
        env:
          IN_PACKAGE: ${{ inputs.package }}
          IN_VERSION: ${{ inputs.breaking-version }}
          TEST_COMMAND: ${{ inputs.test-command }}
          OURS_NODE: ${{ steps.ours.outputs.node }}

      # Everything above exists to reach this line honestly: somebody else's
      # repository, red, for a real reason.
      - name: Run Patchery
        id: patchery
        if: steps.broken.outputs.exit != '0' && steps.broken.outputs.exit != ''
        uses: ./patchery
        continue-on-error: true
        with:
          package: ${{ inputs.package }}
          target-dir: case/${{ inputs.target-dir }}
          test-command: ${{ inputs.test-command }}
          node-version: ${{ steps.baseline.outputs.node }}
          # The default of 25 was not the binding constraint anyone expected. On
          # winston the agent reached the exact cause - readable-stream v3 set
          # `state.pipes` to the destination, v4 always keeps an array - and ran
          # out of turns before it could write anything. Seven of seven results
          # in the first batch were NO-CHANGE, and the transcripts show diagnosis,
          # not confusion. Turns are the cheapest thing here.
          max-turns: ${{ inputs.max-turns }}
          briefing: ${{ inputs.briefing }}
          verify-tools: "off"
          verify-base-url: ${{ vars.ALT_BASE_URL }}
          verify-auth-token: ${{ secrets.ALT_AUTH_TOKEN }}
          verify-model: deepseek-v4-flash
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ secrets.ANTHROPIC_BASE_URL }}
          anthropic-model: ${{ inputs.model != '' && inputs.model || vars.ANTHROPIC_MODEL }}

      # The action reports its own tests-passed. This asks the harder question:
      # are the SAME tests passing. A fix that makes the suite green by removing
      # the tests that judged it is the one failure a green light cannot catch,
      # and the only way to see it is to compare the census.
      - name: Count the tests again
        id: recount
        if: steps.baseline.outputs.exit == '0'
        working-directory: case/${{ inputs.target-dir }}
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set +e
          $TEST_COMMAND > /tmp/final.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          "$OURS_NODE" "$GITHUB_WORKSPACE/patchery/scripts/test-census.mjs" /tmp/final.log > /tmp/census-after.json
          cat /tmp/census-after.json
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          OURS_NODE: ${{ steps.ours.outputs.node }}

      # Every value arrives through the environment, never through ${{ }} inside
      # the shell. One of these - the action summary - is written by a language
      # model, and pasted into a command line it is code. It cost two legs of a
      # benchmark before it was noticed:
      #
      #   syntax error near unexpected token `('
      #
      # A summary containing an apostrophe ("the agent didn't change any files
      # (22 turns)") closed the quote, and the rest of the sentence became shell.
      # That is the harmless version. The same hole runs whatever a summary says,
      # on a runner holding the repository's token.
      - name: Outcome
        if: always()
        run: |
          "$OURS_NODE" "$GITHUB_WORKSPACE/patchery/scripts/benchmark-outcome.mjs" \
            --before /tmp/census-before.json \
            --after /tmp/census-after.json \
            --baseline-exit "$BASELINE_EXIT" \
            --broken-exit "$BROKEN_EXIT" \
            --final-exit "$FINAL_EXIT" \
            --action-outcome "$ACTION_OUTCOME" \
            --guard-reason "$GUARD_REASON" \
            --step-outcome "$STEP_OUTCOME" \
            --action-summary "$ACTION_SUMMARY" \
            --changed "$CHANGED" \
            --review "$REVIEW" \
            --files "$FILES" \
            --repo "$IN_REPO" \
            --package "$IN_PACKAGE" \
            --version "$IN_VERSION" \
            --installed "$INSTALLED" \
            --model "$IN_MODEL" \
            --out /tmp/benchmark.json | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          OURS_NODE: ${{ steps.ours.outputs.node }}
          BASELINE_EXIT: ${{ steps.baseline.outputs.exit }}
          BROKEN_EXIT: ${{ steps.broken.outputs.exit }}
          FINAL_EXIT: ${{ steps.recount.outputs.exit }}
          ACTION_OUTCOME: ${{ steps.patchery.outputs.outcome }}
          GUARD_REASON: ${{ steps.patchery.outputs.guard-reason }}
          STEP_OUTCOME: ${{ steps.patchery.outcome }}
          ACTION_SUMMARY: ${{ steps.patchery.outputs.summary }}
          CHANGED: ${{ steps.patchery.outputs.changed }}
          REVIEW: ${{ steps.patchery.outputs.review-status }}
          FILES: ${{ steps.patchery.outputs.files }}
          IN_REPO: ${{ inputs.repo }}
          IN_PACKAGE: ${{ inputs.package }}
          IN_VERSION: ${{ inputs.breaking-version }}
          INSTALLED: ${{ steps.bump.outputs.installed }}
          IN_MODEL: ${{ inputs.model }}

      - name: Keep everything this run produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ steps.slug.outputs.slug }}
          path: |
            /tmp/benchmark.json
            ${{ steps.patchery.outputs.diagnosis-file }}
            /tmp/census-*.json
            /tmp/*.log
          if-no-files-found: ignore
