# Runs the action end to end against this repo's own broken fixture.
# Purpose: a real, reproducible "it works" run. Triggered by hand.
name: Patchery (demo)

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Name of the package that broke"
        required: true
        default: "fake-lib"
      target-dir:
        description: "Directory to fix"
        required: true
        default: "test-fixture"
      test-command:
        description: "Verification command"
        required: true
        default: "npm test"
      changelog:
        description: "Changelog path (empty = let the agent find it)"
        required: false
        default: "node_modules/fake-lib/CHANGELOG.md"
      dry-run:
        description: "Only measure the baseline, do not run the agent"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The fixture is committed in its broken state on purpose, so every run
      # starts from the same red baseline. Git gives us that for free.
      - name: Run the agent
        id: sma
        uses: ./
        with:
          package: ${{ inputs.package }}
          target-dir: ${{ inputs.target-dir }}
          test-command: ${{ inputs.test-command }}
          changelog: ${{ inputs.changelog }}
          dry-run: ${{ inputs.dry-run }}
          # This repo reviews with GLM, which was measured spending all 12 turns
          # investigating and never answering - on every run, then falling back to
          # the no-tools pass anyway. Skipping straight to that pass saves the
          # wasted call; the verdict caps at `concerns`, which it already did.
          verify-tools: "off"
          # The reviewer runs on a different provider from the fixer. Measured over 23
          # labelled changes: this repo's own model cleared 5 of 12 wrong migrations
          # with "a second agent tried to refute this and could not" - a false all-clear
          # is the expensive error, because it ships a wrong fix wearing a reassurance.
          # DeepSeek cleared none of the 12. It costs more noise on correct fixes
          # (4 of 11 flagged) and ~10x the tokens, and that is the right trade here.
          verify-base-url: ${{ vars.ALT_BASE_URL }}
          verify-auth-token: ${{ secrets.ALT_AUTH_TOKEN }}
          verify-model: deepseek-v4-flash
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ secrets.ANTHROPIC_BASE_URL }}
          anthropic-model: ${{ vars.ANTHROPIC_MODEL }}

      - name: Open a pull request
        if: steps.sma.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: self-maintain/${{ inputs.package }}
          base: main
          title: "fix(deps): migrate ${{ inputs.package }} call sites"
          body-path: ${{ steps.sma.outputs.pr-body-file }}
          # Commit only what the agent actually changed, so install leftovers
          # (node_modules and friends) can never leak into the PR.
          add-paths: ${{ steps.sma.outputs.files }}
          commit-message: |
            fix(deps): migrate ${{ inputs.package }} call sites

            ${{ steps.sma.outputs.summary }}
          # The review outcome as a label, so a refuted-but-still-opened PR is
          # visible in the list rather than only inside the body. In `warn` mode
          # the PR opens either way; the label is what tells them apart.
          labels: |
            dependencies
            automated
            ${{ steps.sma.outputs.review-label }}
          delete-branch: true
