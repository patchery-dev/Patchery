name: "Self-Maintaining APIs"
description: >-
  Let an AI agent fix your code when a dependency ships a breaking change,
  verify the fix against your own tests, and hand you a ready-to-review PR.
  If the tests do not pass, it delivers nothing.
author: "ugursku"

branding:
  icon: "refresh-cw"
  color: "purple"

inputs:
  package:
    description: "Name of the package that broke (e.g. fake-lib, openai, @langchain/google-genai)."
    required: true
  changelog:
    description: >-
      Path or URL to the changelog / migration notes. If empty, the agent looks for
      node_modules/<package>/CHANGELOG.md itself.
    required: false
    default: ""
  target-dir:
    description: "Project directory to fix, relative to the repository root."
    required: false
    default: "."
  test-command:
    description: "Verification command. Run both before and after the fix."
    required: false
    default: "npm test"
  max-turns:
    description: "Maximum number of agent turns - this is your cost brake."
    required: false
    default: "25"
  extra-instructions:
    description: "Free-form extra instructions passed to the agent."
    required: false
    default: ""
  require-failing-baseline:
    description: >-
      When true, the agent is not run at all if the tests already pass. Prevents
      pointless PRs.
    required: false
    default: "true"
  dry-run:
    description: "When true, only measure the baseline test run; do not run the agent."
    required: false
    default: "false"
  node-version:
    description: "Node version to install."
    required: false
    default: "20"
  anthropic-auth-token:
    description: "API key / token. Pass it from GitHub Secrets, never inline."
    required: true
  anthropic-base-url:
    description: "Custom API endpoint (optional). Empty means Anthropic's own API."
    required: false
    default: ""
  anthropic-model:
    description: "Model name (optional)."
    required: false
    default: ""

outputs:
  changed:
    description: "Whether the agent actually changed files ('true' / 'false')."
    value: ${{ steps.run.outputs.changed }}
  tests-passed:
    description: "Whether the tests passed after the fix."
    value: ${{ steps.run.outputs.tests_passed }}
  files:
    description: "Changed files, one per line - ready to feed into add-paths."
    value: ${{ steps.run.outputs.files }}
  pr-body-file:
    description: "Path to the generated PR body - ready to feed into body-path."
    value: ${{ steps.run.outputs.pr_body_file }}
  summary:
    description: "One-line human-readable summary."
    value: ${{ steps.run.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install agent dependencies
      shell: bash
      run: npm install --no-save --no-audit --no-fund "@anthropic-ai/claude-agent-sdk@^0.1.77"
      working-directory: ${{ github.action_path }}

    - name: Run the agent and verify
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # agent.mjs lives in action_path/scripts/, so Node resolves the SDK from
        # action_path/node_modules on its own (ESM ignores NODE_PATH).
        SMA_WORKSPACE: ${{ github.workspace }}
        SMA_TARGET_DIR: ${{ inputs.target-dir }}
        SMA_PACKAGE: ${{ inputs.package }}
        SMA_CHANGELOG: ${{ inputs.changelog }}
        SMA_TEST_COMMAND: ${{ inputs.test-command }}
        SMA_MAX_TURNS: ${{ inputs.max-turns }}
        SMA_EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        SMA_REQUIRE_FAILING_BASELINE: ${{ inputs.require-failing-baseline }}
        SMA_DRY_RUN: ${{ inputs.dry-run }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic-auth-token }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.anthropic-model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.anthropic-model }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.anthropic-model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ inputs.anthropic-model }}
      run: node "${{ github.action_path }}/scripts/agent.mjs"
