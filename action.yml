name: "Patchery"
description: >-
  When a dependency breaks your code, Patchery fixes it and proves the fix.
  Reads the changelog, migrates the call sites, verifies against your own
  tests, and hands you a ready-to-review PR. If the tests do not pass, it
  delivers nothing.
author: "ugursku"

branding:
  icon: "refresh-cw"
  color: "green"

inputs:
  package:
    description: "Name of the package that broke (e.g. fake-lib, openai, @langchain/google-genai)."
    required: true
  changelog:
    description: >-
      Path or URL to the changelog / migration notes. If empty, the agent looks for
      node_modules/<package>/CHANGELOG.md itself.
    required: false
    default: ""
  target-dir:
    description: "Project directory to fix, relative to the repository root."
    required: false
    default: "."
  test-command:
    description: "Verification command. Run both before and after the fix."
    required: false
    default: "npm test"
  max-turns:
    description: "Maximum number of agent turns - this is your cost brake."
    required: false
    default: "25"
  extra-instructions:
    description: "Free-form extra instructions passed to the agent."
    required: false
    default: ""
  require-failing-baseline:
    description: >-
      When true, the agent is not run at all if the tests already pass. Prevents
      pointless PRs.
    required: false
    default: "true"
  dry-run:
    description: "When true, only measure the baseline test run; do not run the agent."
    required: false
    default: "false"
  allowed-paths:
    description: >-
      Paths outside target-dir the agent may still change, one per line (or comma
      separated). Everything else outside target-dir is blocked and reverted.
      Use this for the real case it would otherwise break: a monorepo where
      fixing one package legitimately means touching the root manifest.
    required: false
    default: ""
  allow-deletions:
    description: >-
      Allow the run to delete tracked files. Off by default: a dependency
      migration edits call sites, it does not remove files, so a deletion is
      almost always the agent exceeding its brief - and it would otherwise ride
      along into the pull request unnoticed.
    required: false
    default: "false"
  baseline-retries:
    description: >-
      How many extra times a failing test run is repeated before it is believed.
      A suite that fails once and passes on retry is flaky, not broken, and the
      agent is not run. Set to 0 to trust the first result.
    required: false
    default: "2"
  stall-repeats:
    description: >-
      Stop early if the agent makes the exact same tool call this many times -
      it is going in circles and would otherwise burn the whole turn budget.
    required: false
    default: "3"
  stall-stale-turns:
    description: >-
      Stop early if this many turns in a row find nothing new - every file already
      read, every command already run, every search already made. This is the real
      "going in circles" signal. Opening a file it has never opened, running a new
      command or making a new search is progress and resets it, even when the agent
      has not edited anything yet.
    required: false
    default: "5"
  stall-no-edit-turns:
    description: >-
      Legacy ceiling: stop after this many turns in a row that use tools but change
      nothing, EVEN IF every one of them found something new. Off by default - it
      stops careful agents that are making real progress, which is what
      stall-stale-turns replaced. max-turns is your cost brake. Set this only if you
      deliberately want to cap pure research.
    required: false
    default: "0"
  extra-checks:
    description: >-
      Also run the project's own lint and type-check, and refuse a change that
      breaks one. `auto` (the default) picks up whichever of `typecheck`,
      `type-check`, `tsc` and `lint` your package.json declares; `off` skips this;
      anything else is treated as an explicit list of commands, one per line.
      Always measured against the baseline, never against "is it clean" - a check
      that was already failing before the run is reported and never blamed on the
      change.
    required: false
    default: "auto"
  verify-mode:
    description: >-
      Independent review of the fix by a second, read-only agent. `warn` (the
      default) always opens the pull request and records the verdict in it.
      `block` additionally withholds the PR when that reviewer outright refutes
      the fix - the rejected change is saved as a patch file, never lost. `off`
      skips it. A review that cannot run never blocks, in any mode.
    required: false
    default: "warn"
  verify-model:
    description: >-
      Model for the reviewer. Empty means the same model as the fixer, still in a
      separate call with no shared context, no sight of the fixer's reasoning and
      no write access. The pull request only claims "a different model" when the
      telemetry confirms one actually ran.
    required: false
    default: ""
  verify-base-url:
    description: >-
      Send the review to a different provider. This is the strongest form of
      independence available - two models from the same family share training data
      and blind spots, and a model is least likely to flag its own preferred way of
      getting something wrong. It is also a privacy decision: a second endpoint
      means a second party sees the diff of the code under review. Empty by default
      for exactly that reason.
    required: false
    default: ""
  verify-auth-token:
    description: >-
      Credential for verify-base-url. Pass it from GitHub Secrets. It is redacted
      from logs, the step summary and the pull request body like every other key.
    required: false
    default: ""
  verify-min-confidence:
    description: >-
      Below this confidence the reviewer's verdict is recorded as a concern rather
      than acted on - in both directions. The same bar to condemn as to bless.
    required: false
    default: "60"
  verify-repair:
    description: >-
      When the review raises a concern the fixing agent can act on, give it one more
      turn to address it. Off by default. Most of what a reviewer raises is "I could
      not verify this" rather than "this is wrong", and handing that back invites
      changes to working code - so this only fires on a concern that is serious or
      blocking, names a file, and is backed by a check that actually found something.
      When it does fire, the guard and your tests run again over the result, and the
      review runs again too, so the verdict in the pull request is about the diff in
      the pull request. It costs a second fixer turn and a second review.
    required: false
    default: "false"
  verify-repair-turns:
    description: "Turn limit for the repair turn."
    required: false
    default: "8"
  verify-max-turns:
    description: "Turn limit for the reviewer. It reads and searches; it does not need many."
    required: false
    default: "12"
  verify-max-diff-bytes:
    description: >-
      Skip the review when the diff is larger than this. There is deliberately no
      minimum: a two-line error suppression is both the cheapest diff to review and
      the likeliest to be wrong.
    required: false
    default: "60000"
  node-version:
    description: >-
      Node version used to run your tests. Defaults to the current LTS; Node 20
      is end-of-life. Pin this if your project needs a specific version - the
      version your tests run on decides whether a fix is judged correct.
    required: false
    default: "22"
  anthropic-auth-token:
    description: "API key / token. Pass it from GitHub Secrets, never inline."
    required: true
  anthropic-base-url:
    description: "Custom API endpoint (optional). Empty means Anthropic's own API."
    required: false
    default: ""
  anthropic-model:
    description: "Model name (optional)."
    required: false
    default: ""

outputs:
  outcome:
    description: >-
      How the run ended: 'fixed', 'nothing-to-do', 'flaky', 'inconclusive',
      'no-changes', 'dry-run', 'blocked-by-review' or 'failed'. Everything except
      'failed' exits 0.
    value: ${{ steps.run.outputs.outcome }}
  changed:
    description: "Whether the agent actually changed files ('true' / 'false')."
    value: ${{ steps.run.outputs.changed }}
  tests-passed:
    description: "Whether the tests passed after the fix."
    value: ${{ steps.run.outputs.tests_passed }}
  files:
    description: "Changed files, one per line - ready to feed into add-paths."
    value: ${{ steps.run.outputs.files }}
  pr-body-file:
    description: "Path to the generated PR body - ready to feed into body-path."
    value: ${{ steps.run.outputs.pr_body_file }}
  summary:
    description: "One-line human-readable summary."
    value: ${{ steps.run.outputs.summary }}
  diagnosis-file:
    description: >-
      Path to a markdown diagnosis, written when a run ends `inconclusive`: what it
      tried, why it stopped, and what it had read by then. Empty otherwise. Feed it
      to an issue or upload it as an artifact - opening anything in your repository
      is your workflow's decision, not this action's.
    value: ${{ steps.run.outputs.diagnosis_file }}
  review-status:
    description: >-
      How the independent review ended: not-reviewed, unavailable, not-refuted,
      concerns or refuted.
    value: ${{ steps.run.outputs.review_status }}
  review-label:
    description: "Suggested PR label for the review outcome, e.g. patchery:reviewed."
    value: ${{ steps.run.outputs.review_label }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install agent dependencies
      shell: bash
      run: npm install --no-save --no-audit --no-fund "@anthropic-ai/claude-agent-sdk@^0.1.77"
      working-directory: ${{ github.action_path }}

    - name: Run the agent and verify
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # agent.mjs lives in action_path/scripts/, so Node resolves the SDK from
        # action_path/node_modules on its own (ESM ignores NODE_PATH).
        SMA_WORKSPACE: ${{ github.workspace }}
        SMA_TARGET_DIR: ${{ inputs.target-dir }}
        SMA_PACKAGE: ${{ inputs.package }}
        SMA_CHANGELOG: ${{ inputs.changelog }}
        SMA_TEST_COMMAND: ${{ inputs.test-command }}
        SMA_MAX_TURNS: ${{ inputs.max-turns }}
        SMA_EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        SMA_REQUIRE_FAILING_BASELINE: ${{ inputs.require-failing-baseline }}
        SMA_DRY_RUN: ${{ inputs.dry-run }}
        SMA_ALLOWED_PATHS: ${{ inputs.allowed-paths }}
        SMA_ALLOW_DELETIONS: ${{ inputs.allow-deletions }}
        SMA_BASELINE_RETRIES: ${{ inputs.baseline-retries }}
        SMA_STALL_REPEATS: ${{ inputs.stall-repeats }}
        SMA_STALL_STALE_TURNS: ${{ inputs.stall-stale-turns }}
        SMA_STALL_NO_EDIT_TURNS: ${{ inputs.stall-no-edit-turns }}
        SMA_EXTRA_CHECKS: ${{ inputs.extra-checks }}
        SMA_VERIFY_MODE: ${{ inputs.verify-mode }}
        SMA_VERIFY_MODEL: ${{ inputs.verify-model }}
        SMA_VERIFY_BASE_URL: ${{ inputs.verify-base-url }}
        SMA_VERIFY_AUTH_TOKEN: ${{ inputs.verify-auth-token }}
        SMA_VERIFY_MIN_CONFIDENCE: ${{ inputs.verify-min-confidence }}
        SMA_VERIFY_REPAIR: ${{ inputs.verify-repair }}
        SMA_VERIFY_REPAIR_TURNS: ${{ inputs.verify-repair-turns }}
        SMA_VERIFY_MAX_TURNS: ${{ inputs.verify-max-turns }}
        SMA_VERIFY_MAX_DIFF_BYTES: ${{ inputs.verify-max-diff-bytes }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic-auth-token }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.anthropic-model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.anthropic-model }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.anthropic-model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ inputs.anthropic-model }}
      run: node "${{ github.action_path }}/scripts/agent.mjs"
